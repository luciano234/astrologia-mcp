[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrologia-mcp"
version = "1.0.0"
description = "Servidor MCP en español para consultar datos astrológicos de CosmyDay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
astrologia-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
