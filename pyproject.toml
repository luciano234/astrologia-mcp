[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrologia-mcp"
version = "1.1.0"
description = "Spanish/English MCP server for CosmyDay astrology data / Servidor MCP en español e inglés para consultar datos astrológicos de CosmyDay"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "luciano234" }]
keywords = ["mcp", "model-context-protocol", "astrology", "astrologia", "horoscope", "natal-chart", "cosmyday"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish",
    "Natural Language :: English",
]
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/luciano234/astrologia-mcp"
Repository = "https://github.com/luciano234/astrologia-mcp"
Issues = "https://github.com/luciano234/astrologia-mcp/issues"

[project.scripts]
astrologia-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
